<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 响应数据测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .test-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .test-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        button.secondary:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        .result-box {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
            max-height: 600px;
            overflow-y: auto;
        }

        .result-box h3 {
            color: #495057;
            margin-bottom: 10px;
            font-size: 16px;
        }

        pre {
            background: #2d3748;
            color: #68d391;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.5;
            margin-top: 10px;
        }

        .field-analysis {
            margin-top: 15px;
        }

        .field-item {
            background: white;
            border-left: 4px solid #667eea;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .field-name {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 5px;
        }

        .field-value {
            color: #495057;
            font-family: monospace;
        }

        .field-status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .field-status.ok {
            background: #c6f6d5;
            color: #22543d;
        }

        .field-status.missing {
            background: #fed7d7;
            color: #742a2a;
        }

        .field-status.empty {
            background: #feebc8;
            color: #7c2d12;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            border-left: 4px solid #c53030;
        }

        .success {
            background: #c6f6d5;
            color: #22543d;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            border-left: 4px solid #22543d;
        }

        .info-box {
            background: #bee3f8;
            color: #2c5282;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #2c5282;
        }

        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 育种数据集 API 响应测试</h1>

        <div class="info-box">
            <strong>测试说明：</strong>
            本工具用于测试后端 API 返回的数据格式，检查字段命名是否为驼峰格式，以及数据是否完整。
            <br><br>
            <strong>测试步骤：</strong>
            1. 点击下方按钮测试各个 API<br>
            2. 查看返回的数据格式和字段命名<br>
            3. 根据测试结果决定是否需要简化前端代码
        </div>

        <!-- 数据集编制列表测试 -->
        <div class="test-section">
            <h2>📋 1. 数据集编制列表 API</h2>
            <div class="button-group">
                <button onclick="testDatasetList()">测试编制列表 API</button>
                <button class="secondary" onclick="clearResult('dataset-list')">清空结果</button>
            </div>
            <div id="dataset-list-result"></div>
        </div>

        <!-- 数据集审核列表测试 -->
        <div class="test-section">
            <h2>✅ 2. 数据集审核列表 API</h2>
            <div class="button-group">
                <button onclick="testAuditList()">测试审核列表 API</button>
                <button class="secondary" onclick="clearResult('audit-list')">清空结果</button>
            </div>
            <div id="audit-list-result"></div>
        </div>

        <!-- 数据集详情测试 -->
        <div class="test-section">
            <h2>📄 3. 数据集详情 API</h2>
            <div class="button-group">
                <input type="text" id="dataset-id-input" placeholder="输入数据集 ID" style="padding: 10px; border: 1px solid #ddd; border-radius: 6px; flex: 1; max-width: 300px;">
                <button onclick="testDatasetDetail()">测试详情 API</button>
                <button class="secondary" onclick="clearResult('dataset-detail')">清空结果</button>
            </div>
            <div id="dataset-detail-result"></div>
        </div>
    </div>

    <script>
        // API 基础配置
        const API_BASE = '/ditp/auth';

        // 获取 token
        function getToken() {
            return localStorage.getItem('token');
        }

        // 通用请求函数
        async function apiRequest(url, method = 'GET', data = null) {
            const token = getToken();
            if (!token) {
                throw new Error('未找到登录 token，请先登录系统');
            }

            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': token
                }
            };

            if (data && method === 'POST') {
                options.body = JSON.stringify(data);
            }

            const response = await fetch(API_BASE + url, options);
            return await response.json();
        }

        // 分析字段
        function analyzeFields(data, expectedFields) {
            const analysis = [];

            expectedFields.forEach(field => {
                const value = data[field];
                let status, statusClass;

                if (value === undefined) {
                    status = '缺失';
                    statusClass = 'missing';
                } else if (value === null || value === '' || value === '-') {
                    status = '空值';
                    statusClass = 'empty';
                } else {
                    status = '正常';
                    statusClass = 'ok';
                }

                analysis.push({
                    name: field,
                    value: value,
                    status: status,
                    statusClass: statusClass
                });
            });

            return analysis;
        }

        // 渲染字段分析
        function renderFieldAnalysis(analysis) {
            return `
                <div class="field-analysis">
                    <h3>📊 字段分析：</h3>
                    ${analysis.map(field => `
                        <div class="field-item">
                            <div class="field-name">
                                ${field.name}
                                <span class="field-status ${field.statusClass}">${field.status}</span>
                            </div>
                            <div class="field-value">值: ${JSON.stringify(field.value)}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // 1. 测试数据集编制列表
        async function testDatasetList() {
            const resultDiv = document.getElementById('dataset-list-result');
            resultDiv.innerHTML = '<div class="loading">⏳ 正在请求 API...</div>';

            try {
                const response = await apiRequest('/seed/dataset/list', 'POST', {
                    pageNum: 1,
                    pageSize: 10
                });

                console.log('编制列表响应:', response);

                const firstItem = response.data?.list?.[0] || response.data?.rows?.[0];

                const expectedFields = [
                    'datasetCode', 'batchName', 'createdTime', 'trialId', 'batchId',
                    'versionNo', 'recordCount', 'labTestCount', 'yieldDataCount',
                    'cropType', 'varietyName'
                ];

                let html = `
                    <div class="success">✅ API 请求成功</div>
                    <div class="result-box">
                        <h3>📦 完整响应数据：</h3>
                        <pre>${JSON.stringify(response, null, 2)}</pre>
                    </div>
                `;

                if (firstItem) {
                    const analysis = analyzeFields(firstItem, expectedFields);
                    html += `
                        <div class="result-box">
                            <h3>🔍 第一条数据分析：</h3>
                            ${renderFieldAnalysis(analysis)}
                        </div>
                    `;
                } else {
                    html += '<div class="error">⚠️ 列表为空，无法分析字段</div>';
                }

                resultDiv.innerHTML = html;
            } catch (error) {
                console.error('测试失败:', error);
                resultDiv.innerHTML = `<div class="error">❌ 错误: ${error.message}</div>`;
            }
        }

        // 2. 测试审核列表
        async function testAuditList() {
            const resultDiv = document.getElementById('audit-list-result');
            resultDiv.innerHTML = '<div class="loading">⏳ 正在请求 API...</div>';

            try {
                const response = await apiRequest('/seed/dataset/audit/list', 'POST', {
                    pageNum: 1,
                    pageSize: 10
                });

                console.log('审核列表响应:', response);

                const firstItem = response.data?.list?.[0];

                const expectedFields = [
                    'datasetCode', 'trialId', 'batchId', 'batchName', 'versionNo',
                    'recordCount', 'labTestCount', 'yieldDataCount', 'varietyName',
                    'submitTime', 'auditStatus', 'datasetStatus'
                ];

                let html = `
                    <div class="success">✅ API 请求成功</div>
                    <div class="result-box">
                        <h3>📦 完整响应数据：</h3>
                        <pre>${JSON.stringify(response, null, 2)}</pre>
                    </div>
                `;

                if (firstItem) {
                    const analysis = analyzeFields(firstItem, expectedFields);
                    html += `
                        <div class="result-box">
                            <h3>🔍 第一条数据分析：</h3>
                            ${renderFieldAnalysis(analysis)}
                        </div>
                    `;
                } else {
                    html += '<div class="error">⚠️ 列表为空，无法分析字段</div>';
                }

                resultDiv.innerHTML = html;
            } catch (error) {
                console.error('测试失败:', error);
                resultDiv.innerHTML = `<div class="error">❌ 错误: ${error.message}</div>`;
            }
        }

        // 3. 测试数据集详情
        async function testDatasetDetail() {
            const resultDiv = document.getElementById('dataset-detail-result');
            const datasetId = document.getElementById('dataset-id-input').value;

            if (!datasetId) {
                resultDiv.innerHTML = '<div class="error">⚠️ 请输入数据集 ID</div>';
                return;
            }

            resultDiv.innerHTML = '<div class="loading">⏳ 正在请求 API...</div>';

            try {
                const response = await apiRequest(`/seed/dataset/getById/${datasetId}`);

                console.log('详情响应:', response);

                const data = response.data;

                const expectedFields = [
                    'datasetCode', 'trialId', 'batchId', 'batchName', 'versionNo',
                    'recordCount', 'compiledBy', 'compiledByName', 'compiledAt',
                    'cropType', 'varietyName', 'datasetStatus'
                ];

                let html = `
                    <div class="success">✅ API 请求成功</div>
                    <div class="result-box">
                        <h3>📦 完整响应数据：</h3>
                        <pre>${JSON.stringify(response, null, 2)}</pre>
                    </div>
                `;

                if (data) {
                    const analysis = analyzeFields(data, expectedFields);
                    html += `
                        <div class="result-box">
                            <h3>🔍 数据字段分析：</h3>
                            ${renderFieldAnalysis(analysis)}
                        </div>
                    `;
                }

                resultDiv.innerHTML = html;
            } catch (error) {
                console.error('测试失败:', error);
                resultDiv.innerHTML = `<div class="error">❌ 错误: ${error.message}</div>`;
            }
        }

        // 清空结果
        function clearResult(section) {
            document.getElementById(section + '-result').innerHTML = '';
        }

        // 页面加载时检查登录状态
        window.onload = function() {
            const token = getToken();
            if (!token) {
                alert('⚠️ 未检测到登录 token\n\n请先在主系统中登录，然后再使用此测试工具。');
            }
        };
    </script>
</body>
</html>
